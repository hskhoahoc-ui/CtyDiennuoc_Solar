<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng Nhập Quản Trị - CÔNG TY CP ĐIỆN NƯỚC AN GIANG</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              brandBlue: '#0056b3',
              brandRed: '#dc3545',
              brandDark: '#1a202c'
            }
          }
        }
      }
    </script>
</head>
<body class="bg-gray-100 font-sans text-gray-800 flex items-center justify-center min-h-screen">

    <div class="bg-white p-8 rounded-xl shadow-2xl w-full max-w-md border-t-4 border-brandBlue">
        <div class="text-center mb-6">
            <img src="logo.png" alt="Logo POWACO" class="w-20 h-20 object-contain mx-auto mb-2 rounded shadow" onerror="this.src='https://i.imgur.com/7j8p3Q8.png'">
            <h1 class="text-xl font-black text-brandBlue">CÔNG TY CP ĐIỆN NƯỚC AN GIANG</h1>
            <p class="text-xs text-gray-500 mt-1">Hệ Thống Quản Trị Điện Năng Lượng Mặt Trời</p>
        </div>

        <form id="login-form" onsubmit="handleLogin(event)">
            <div class="mb-4">
                <label class="block text-xs font-bold text-gray-700 mb-1"><i class="fas fa-user text-brandBlue mr-1"></i> Tên Đăng Nhập</label>
                <input type="text" id="username" placeholder="Nhập tài khoản (admin)..." class="w-full text-sm border rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brandBlue" required>
            </div>
            <div class="mb-6">
                <label class="block text-xs font-bold text-gray-700 mb-1"><i class="fas fa-lock text-brandBlue mr-1"></i> Mật Khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu ......." class="w-full text-sm border rounded-lg px-3 py-2.5 focus:outline-none focus:ring-2 focus:ring-brandBlue" required>
            </div>
            
            <div id="error-msg" class="mb-4 text-xs text-brandRed font-bold text-center hidden"></div>

            <button type="submit" class="w-full bg-brandBlue text-white font-bold py-2.5 rounded-lg hover:bg-blue-700 shadow transition flex items-center justify-center">
                <i class="fas fa-sign-in-alt mr-2"></i> Đăng Nhập Hệ Thống
            </button>
        </form>

        <div class="mt-6 text-center border-t pt-4">
            <a href="index.html" class="text-xs text-blue-600 hover:underline"><i class="fas fa-arrow-left mr-1"></i> Quay về Trang Chủ công khai</a>
        </div>
        
        <div class="mt-4 text-center bg-blue-50 p-2 rounded text-[11px] text-gray-600">
            Mặc định: <span class="font-bold text-brandBlue">admin</span> / <span class="font-bold text-brandBlue">123456</span>
        </div>
    </div>

    <script>
        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const errDiv = document.getElementById('error-msg');
            errDiv.classList.add('hidden');

            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (data.success) {
                    // Lưu trạng thái đăng nhập vào SessionStorage
                    sessionStorage.setItem('isLoggedIn', 'true');
                    sessionStorage.setItem('username', username);
                    window.location.href = 'admin.html';
                } else {
                    errDiv.innerText = data.error || 'Đăng nhập thất bại!';
                    errDiv.classList.remove('hidden');
                }
            } catch (err) {
                errDiv.innerText = 'Lỗi kết nối đến máy chủ!';
                errDiv.classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
